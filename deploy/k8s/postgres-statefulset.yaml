apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: label-viewer-postgres
  labels:
    app: label-viewer
    app.kubernetes.io/component: database
spec:
  serviceName: label-viewer-postgres
  replicas: 1
  selector:
    matchLabels:
      app: label-viewer-postgres
  template:
    metadata:
      labels:
        app: label-viewer-postgres
        app.kubernetes.io/name: label-viewer
        app.kubernetes.io/component: database
    spec:
      containers:
        - name: postgres
          image: postgres:17
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: label_viewer
            - name: POSTGRES_USER
              value: label_viewer
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: label-viewer-postgres
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 4Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: label-viewer-postgres-data
