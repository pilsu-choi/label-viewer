apiVersion: apps/v1
kind: Deployment
metadata:
  name: label-viewer
  labels:
    app: label-viewer
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: label-viewer
  template:
    metadata:
      labels:
        app: label-viewer
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001   # PVC 를 labelviewer 가 쓸 수 있게 한다
      containers:
        - name: label-viewer
          image: label-viewer
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8765
              name: http
          env:
            - name: LABEL_VIEWER_DATA
              value: /data
            - name: LABEL_VIEWER_MAX_UPLOAD_MB
              value: "2048"
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 4Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: label-viewer-data
