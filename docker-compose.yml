# 단일 컨테이너 배포. 로컬: docker compose up -d --build → http://127.0.0.1:8765
# AWS 서버도 이 파일을 그대로 쓴다(deploy/aws/deploy.sh 가 .env.aws 와 함께 올린다).
name: label-viewer

services:
  label-viewer:
    build: .
    image: label-viewer:latest
    container_name: label-viewer
    restart: unless-stopped
    environment:
      LABEL_VIEWER_MAX_UPLOAD_MB: ${LABEL_VIEWER_MAX_UPLOAD_MB:-2048}
    ports:
      # 기본은 루프백 전용. 인증이 없으므로 외부 노출은 SSH 터널로 한다.
      - "${LABEL_VIEWER_BIND:-127.0.0.1}:${LABEL_VIEWER_PORT:-8765}:8765"
    volumes:
      - data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/health')"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  data:
